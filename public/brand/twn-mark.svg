<?xml version="1.0" encoding="UTF-8"?>
<!-- TWN wordmark. One colour; flips with the system theme. Open in Figma as-is. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" role="img" aria-labelledby="twn-title">
  <title id="twn-title">TWN</title>
  <style>
    .twn { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .twn { fill: #fcfbf8; }
    }
  </style>
  <text
    class="twn"
    x="32"
    y="24"
    text-anchor="middle"
    font-family="Playfair Display, Georgia, Times New Roman, serif"
    font-size="22"
    font-weight="700"
    letter-spacing="2.4"
  >TWN</text>
</svg>
